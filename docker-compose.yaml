# ============================================================================
# Conduit Deployment - Production Setup
# Frontend (Angular) + Backend (Django/Gunicorn) + PostgreSQL
# ============================================================================

services:
  # ==========================================================================
  # PostgreSQL Database (Checklist Requirement!)
  # ==========================================================================
  database:
    image: postgres:13-alpine
    container_name: conduit-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
      POSTGRES_USER: ${POSTGRES_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    networks:
      - conduit-network
    
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conduit}"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  # ==========================================================================
  # Backend: Django + Gunicorn (WSGI Server - Checklist Requirement!)
  # ==========================================================================
  backend:
    build:
      # for files located in backend-directory
      context: ./conduit-backend
      dockerfile: ../backend.Dockerfile

      # for files located in root-directory
      # context: .
      # dockerfile: backend.Dockerfile
    
    container_name: conduit-backend
    restart: unless-stopped
    
    # depends_on:
    #   database:
    #     condition: service_healthy
    
    environment:
      # Django Settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,conduit-backend}
      
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8282}
      
      # PostgreSQL Connection
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: ${POSTGRES_DB:-conduit}
      DATABASE_USER: ${POSTGRES_USER:-conduit}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      
      # Server
      PORT: 8000
    
    volumes:
      # WICHTIG: Static files für Nginx!
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    
    expose:
      - "8000"
    
    networks:
      - conduit-network
    
    # healthcheck:
    #   test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()\""]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  # ==========================================================================
  # Backend Nginx - Static Files + API Reverse Proxy
  # ==========================================================================
  # LÖSUNG FÜR CSS-PROBLEM: Nginx serviert static files, nicht Gunicorn!
  backend-nginx:
    image: nginx:alpine
    container_name: conduit-backend-nginx
    restart: unless-stopped
    
    # depends_on:
    #   backend:
    #     condition: service_healthy
    
    ports:
      - "${BACKEND_PORT:-8000}:80"
    
    volumes:
      # Nginx Config
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      
      # WICHTIG: Shared volumes mit Backend für static files!
      - static_volume:/staticfiles:ro
      - media_volume:/mediafiles:ro
    
    networks:
      - conduit-network
    
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3

  # ==========================================================================
  # Frontend: Angular + Nginx
  # ==========================================================================
  frontend:
    build:
      context: ./conduit-frontend
      dockerfile: ../frontend.Dockerfile
    
    container_name: conduit-frontend
    restart: unless-stopped
    
    # depends_on:
    #   backend-nginx:
    #     condition: service_healthy
    
    environment:
      NGINX_PORT: 4200
    
    ports:
      # Checklist Requirement: Port 8282!
      - "${FRONTEND_PORT:-8282}:4200"
    
    networks:
      - conduit-network
    
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4200"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3

# ============================================================================
# Volumes - Persistent Storage (Checklist Requirement!)
# ============================================================================
volumes:
  # PostgreSQL Data
  postgres_data:
    driver: local
  
  # Django Static Files (CSS, JS, Admin assets)
  # Diese werden von backend-nginx ausgeliefert!
  static_volume:
    driver: local
  
  # Media Files (User Uploads)
  media_volume:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  conduit-network:
    driver: bridge
