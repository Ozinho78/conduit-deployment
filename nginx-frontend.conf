server {
    listen 4200;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ========================================================================
    # ANGULAR SPA ROUTING
    # ========================================================================
    # Alle Frontend-Routen zu index.html (für Client-Side Routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========================================================================
    # STATIC ASSETS CACHING
    # ========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========================================================================
    # API PROXY zum Backend
    # ========================================================================
    # Frontend ruft /api/ auf → wird zu backend-nginx weitergeleitet
    location /api/ {
        # Proxy zu backend-nginx (NICHT direkt zu backend!)
        proxy_pass http://backend-nginx/api/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================================================
    # GZIP COMPRESSION
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
}
