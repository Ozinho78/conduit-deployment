services:
  database:
    image: postgres:13-alpine
    container_name: conduit-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
      POSTGRES_USER: ${POSTGRES_USER:-conduit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    networks:
      - conduit-network
    
  backend:
    build:
      context: ./conduit-backend
      dockerfile: ../backend.Dockerfile
    
    container_name: conduit-backend
    restart: unless-stopped
    
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,conduit-backend}
      
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8282}
      
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: ${POSTGRES_DB:-conduit}
      DATABASE_USER: ${POSTGRES_USER:-conduit}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      
      PORT: 8000
    
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    
    expose:
      - "8000"
    
    networks:
      - conduit-network
    
  backend-nginx:
    image: nginx:alpine
    container_name: conduit-backend-nginx
    restart: unless-stopped
    
    ports:
      - "${BACKEND_PORT:-8000}:80"
    
    volumes:
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/staticfiles:ro
      - media_volume:/mediafiles:ro
    
    networks:
      - conduit-network
    
  frontend:
    build:
      context: ./conduit-frontend
      dockerfile: ../frontend.Dockerfile
    
    container_name: conduit-frontend
    restart: unless-stopped
    
    environment:
      NGINX_PORT: 4200
    
    ports:
      - "${FRONTEND_PORT:-8282}:4200"
    
    networks:
      - conduit-network
    
volumes:
  postgres_data:
    driver: local
  
  static_volume:
    driver: local
  
  media_volume:
    driver: local

networks:
  conduit-network:
    driver: bridge
