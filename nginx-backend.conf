server {
    listen 80;
    server_name _;

    # Logging
    access_log /var/log/nginx/backend-access.log;
    error_log /var/log/nginx/backend-error.log;

    # Client body size (für File Uploads)
    client_max_body_size 20M;

    # ========================================================================
    # STATIC FILES - Django CSS/JS/Images (collectstatic)
    # ========================================================================
    # WICHTIG: Nginx serviert die statischen Dateien, NICHT Gunicorn!
    # Das ist die Lösung für das CSS-Problem!
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Falls Dateien nicht gefunden werden, versuche ohne trailing slash
        try_files $uri $uri/ =404;
    }

    # Media Files (User Uploads)
    location /media/ {
        alias /mediafiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ========================================================================
    # API ENDPOINTS - Proxy zu Gunicorn mit CORS
    # ========================================================================
    location /api/ {
        # CORS Headers für Frontend
        add_header Access-Control-Allow-Origin http://localhost:8282 always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, User-Agent, X-Requested-With" always;

        # Preflight Requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Proxy zu Gunicorn Backend
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================================================
    # ADMIN & ROOT - Proxy zu Gunicorn (mit Static Files!)
    # ========================================================================
    # Django Admin Panel braucht auch die static files!
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Health Check
    location /health {
        access_log off;
        proxy_pass http://backend:8000/api/health;
    }
}
